# Milestone 3.3 -- deploy image real-time API (Milestone 3.1/3.2) ke
# Kubernetes lokal (Docker Desktop). Lihat
# milestones/3.3-deployment-kubernetes/decisions.md untuk keputusan lengkap.
#
# Target LOKAL sengaja (bukan cloud) -- KT baru docs/keputusan-tertunda.md
# dan KD baru docs/keterbatasan-diterima.md mencatat alasan+pemicu
# peninjauan ulang.
#
# imagePullPolicy: IfNotPresent -- Docker Desktop Kubernetes berbagi image
# store yang sama dengan `docker build` lokal, TIDAK perlu push ke registry
# eksternal manapun (Keputusan #2). Kredensial WAJIB lewat Secret
# `churn-api-secrets` (dibuat manual via `kubectl create secret`, TIDAK
# dicommit) -- manifest ini TIDAK berisi nilai kredensial apa pun (Keputusan
# #6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-api
  namespace: churn-prediction
  labels:
    app: churn-api
spec:
  replicas: 1
  # strategy/revisionHistoryLimit -- dibuat EKSPLISIT Milestone 3.11 (nilainya
  # SAMA PERSIS dengan default implisit K8s yang sudah berlaku sejak M3.3,
  # murni supaya kapabilitas rollback terdokumentasi sadar, bukan kebetulan
  # default -- lihat milestones/3.11-.../decisions.md Keputusan #3).
  # maxUnavailable:0 berarti pod lama TIDAK PERNAH diturunkan sampai pod baru
  # Ready -- rollout yang gagal health check macet aman (zero-downtime
  # inheren), kubectl rollout undo dipakai membersihkan status tidak sehat.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: churn-api
  template:
    metadata:
      labels:
        app: churn-api
    spec:
      containers:
        - name: churn-api
          image: churn-inference:m3.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: churn-api-secrets
          # startupProbe -- forced by bukti empiris M3.2 KK3: startup gagal-
          # registry butuh ~100 detik (retry backoff eksponensial internal
          # mlflow.store.db.utils) sebelum port terbuka, app TETAP hidup
          # (bukan bug). Budget 30 x 10s = 300 detik supaya livenessProbe
          # tidak membunuh pod prematur di tengah startup lambat yang
          # legitimate. Keputusan #4.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          # livenessProbe -- HANYA cek proses hidup (/healthz selalu 200),
          # TIDAK cek status model. Keputusan #3: kalau digabung dengan
          # readiness, pod dengan model gagal dimuat akan di-restart terus-
          # menerus tanpa pernah membantu (restart tidak memperbaiki
          # dependency eksternal yang down).
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
          # readinessProbe -- mencerminkan KESIAPAN MODEL (/readyz, KK2
          # M3.3), bukan cuma proses hidup. Gagal -> pod dikeluarkan dari
          # trafik Service, TIDAK di-restart.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
            failureThreshold: 3
          # RE-VALIDASI Milestone 3.11 dengan metrik NATIVE Kubernetes
          # (kubectl top + metrics-server, BUKAN lagi proxy `docker stats`
          # M3.3) -- nilai TIDAK berubah, terbukti sudah tepat. Uji beban
          # bertingkat (1/10/50/100 request /predict paralel, lihat
          # milestones/3.11-.../logs.md Checkpoint 4-5) menemukan idle
          # steady-state ~89-321m CPU / 340-341Mi memory, dan PUNCAK
          # TERTINGGI di SEMUA level cuma ~1122m CPU / 462Mi memory --
          # requests (200m/400Mi) tetap margin wajar di atas idle (tidak
          # boros), limits (1500m/768Mi) tetap headroom cukup di atas
          # puncak (~34%/~66%). Konkurensi >=50 memicu restart nyata via
          # livenessProbe, TAPI TERBUKTI BUKAN karena CPU throttled/OOM --
          # root cause real-time API (M3.2) memproses request secara
          # efektif single-worker (KD-3, docs/keterbatasan-diterima.md),
          # di luar cakupan resource sizing K8s milestone ini.
          resources:
            requests:
              cpu: "200m"
              memory: "400Mi"
            limits:
              cpu: "1500m"
              memory: "768Mi"
