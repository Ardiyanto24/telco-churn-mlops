name: test

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev,orchestration]"

      - name: Run unit test suite (no external credentials needed)
        run: pytest tests/ -v -m "not integration" --cov=churn_prediction --cov-branch --cov-report=term-missing

  quality-data-check:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      # Gerbang kualitas data (M2.4) OTOMATIS, dipicu tiap push -- mode
      # non-recording (record_history=False), TIDAK menulis ke
      # quality.gate_run_history supaya tidak mencemari baseline yang
      # dipakai DAG produksi (M2.5). Verdict stop menggagalkan job ini.
      - name: Run quality gate check (non-recording) against live data
        env:
          BATCH_READER_DB_URL: ${{ secrets.BATCH_READER_DB_URL }}
          QUALITY_GATE_DB_URL: ${{ secrets.QUALITY_GATE_DB_URL }}
        run: python orchestration/ci_quality_check.py

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev,orchestration]"

      # Dua langkah pytest TERPISAH (bukan satu invocation) -- Milestone 2.7
      # menemukan kuirk mlflow-skinny: MlflowClient men-cache engine/store
      # per tracking-URI di dalam PROSES yang sama tanpa pernah dispose;
      # kalau satu test beralih ke tracking URI SQLite sementara (mis.
      # tests/inference/test_e2e_parity.py, tmp_path) lalu test LAIN
      # (tests/orchestration/, memanggil predict_active() ke registry
      # Postgres sungguhan) jalan sesudahnya di proses yang SAMA, resolusi
      # alias "champion" gagal MlflowException palsu -- dibuktikan lewat
      # repro minimal (lihat milestones/2.7-cicd-verifikasi-parity/decisions.md).
      # Proses terpisah = state MLflow tidak pernah bocor antar test file.
      - name: Run integration tests -- orchestration (real MLflow registry)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BATCH_READER_DB_URL: ${{ secrets.BATCH_READER_DB_URL }}
          BATCH_WRITER_DB_URL: ${{ secrets.BATCH_WRITER_DB_URL }}
          QUALITY_GATE_DB_URL: ${{ secrets.QUALITY_GATE_DB_URL }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
          MLFLOW_ARTIFACT_BUCKET: ${{ secrets.MLFLOW_ARTIFACT_BUCKET }}
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
        run: pytest tests/orchestration -v -m integration

      - name: Run integration tests -- lainnya (parity, schema, quality)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BATCH_READER_DB_URL: ${{ secrets.BATCH_READER_DB_URL }}
          BATCH_WRITER_DB_URL: ${{ secrets.BATCH_WRITER_DB_URL }}
          QUALITY_GATE_DB_URL: ${{ secrets.QUALITY_GATE_DB_URL }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
          MLFLOW_ARTIFACT_BUCKET: ${{ secrets.MLFLOW_ARTIFACT_BUCKET }}
        run: pytest tests/ -v -m integration --ignore=tests/orchestration

  # Milestone 3.x (Orang #3, real-time API): tambahkan job baru di file ini
  # dengan `needs: [unit-tests, quality-data-check, integration-tests]` untuk
  # gerbang deployment service Anda sendiri -- pipeline CI yang sama, bukan
  # infrastruktur terpisah (lihat milestones/2.7-cicd-verifikasi-parity/report.md).
