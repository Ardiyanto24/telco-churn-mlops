# Milestone 3.5 -- Deployment Grafana. Admin password dari Secret
# `monitoring-secrets` (key GF_SECURITY_ADMIN_PASSWORD, ditambahkan manual
# lewat kubectl, TIDAK dicommit -- pola sama churn-api-secrets M3.3).
# Milestone 3.7 -- volume `alerting` (provisioning contact point+rule+policy
# notifikasi drift). envFrom Secret sudah ter-mount sejak awal, dipakai
# provisioning alerting via $__env{} tanpa perlu env var eksplisit baru.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.3.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: monitoring-secrets
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-json
              mountPath: /var/lib/grafana/dashboards
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-json
          configMap:
            name: grafana-dashboard-churn-monitoring
        - name: alerting
          configMap:
            name: grafana-alerting
