# Milestone 3.5/3.6 -- scrape config Prometheus. Target lintas-namespace:
# churn-api (namespace churn-prediction, M3.3), pipeline-health-exporter
# (namespace monitoring, M3.5), drift-exporter (namespace monitoring, M3.6)
# -- semua diakses via DNS Service K8s `<service>.<namespace>.svc.cluster.local`,
# TIDAK perlu ServiceMonitor/CRD operator tambahan (konsisten pola
# manifest-driven infra/k8s/ yang sudah ada).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: churn-api
        metrics_path: /metrics
        static_configs:
          - targets: ["churn-api.churn-prediction.svc.cluster.local:80"]

      - job_name: pipeline-health-exporter
        metrics_path: /metrics
        static_configs:
          - targets: ["pipeline-health-exporter.monitoring.svc.cluster.local:9100"]

      - job_name: drift-exporter
        metrics_path: /metrics
        static_configs:
          - targets: ["drift-exporter.monitoring.svc.cluster.local:9101"]
