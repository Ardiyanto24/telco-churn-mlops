# Milestone 3.3 -- expose churn-api dari luar cluster. type: LoadBalancer
# dipilih karena Docker Desktop Kubernetes auto-map ke localhost tanpa
# tooling tambahan (beda dari minikube yang butuh `minikube tunnel`).
# Fallback NodePort kalau ternyata bermasalah empiris -- lihat
# milestones/3.3-deployment-kubernetes/decisions.md Keputusan #7.
apiVersion: v1
kind: Service
metadata:
  name: churn-api
  namespace: churn-prediction
spec:
  type: LoadBalancer
  selector:
    app: churn-api
  ports:
    - port: 80
      targetPort: 8000
