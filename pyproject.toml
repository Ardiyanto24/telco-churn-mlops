[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn_prediction"
version = "0.1.0"
description = "Modul transformasi (preprocessing + feature engineering) untuk model churn prediction telekomunikasi."
# >=3.12 -- batas nyata numpy==2.5.2 di bawah (bukan ">=3.11" seperti sebelumnya,
# yang tidak pernah benar-benar diverifikasi -- venv dev proyek ini sebenarnya
# Python 3.13.12). Ketidaksesuaian ini adalah akar penyebab CI (.github/workflows/
# test.yml) gagal di SETIAP push sejak repo terhubung ke GitHub, baru ditemukan
# Milestone 2.7 lewat `gh run list` -- lihat milestones/2.7-cicd-verifikasi-parity/
# decisions.md.
requires-python = ">=3.12"
# Dikunci Checkpoint 6 (2026-08-11) -- lihat milestones/1.2-modularisasi-preprocessing/decisions.md
# Keputusan #2. scikit-learn==1.6.1 DIKONFIRMASI, bukan tebakan -- terungkap dari
# InconsistentVersionWarning saat memuat artifacs/proprocessor/preprocessor.joblib
# asli DS (lihat docs/keputusan-tertunda.md KT-3). Seluruh 32 test suite dijalankan
# ulang dan lulus persis dengan versi ini. pandas/numpy/joblib TETAP PROVISIONAL --
# dikunci ke versi yang terbukti jalan di environment ini (pip freeze), bukan
# versi training asli DS yang tidak tercatat di manapun (KT-3 belum tertutup
# untuk ketiganya).
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.2",
    "scikit-learn==1.6.1",
    "joblib==1.5.3",
    # pandera/pydantic: library baru Milestone 1.3 (validasi skema), tidak pernah
    # dipakai DS -- dipin ke versi stabil terkini, bukan "provisional" ala KT-3
    # (lihat milestones/1.3-skema-validasi-input/decisions.md Keputusan #3).
    "pandera==0.32.1",
    "pydantic==2.13.4",
    # mlflow-skinny (BUKAN "mlflow" penuh) -- Milestone 1.5, library baru yang
    # kita perkenalkan sendiri (dipin langsung, bukan provisional ala KT-3).
    # "mlflow" penuh mensyaratkan pandas<3, bentrok dengan pandas==3.0.5 yang
    # sudah dikunci M1.2 -- mlflow-skinny menyediakan seluruh API yang dipakai
    # (pyfunc, registry) tanpa dependency pandas/numpy/scikit-learn sama sekali.
    # Lihat milestones/1.5-inference-service/decisions.md Keputusan #8.
    "mlflow-skinny==3.15.1",
    # lightgbm/xgboost: model_final.joblib adalah VotingClassifier berisi
    # LGBMClassifier + 2x XGBClassifier (baru terungkap M1.5 Checkpoint 2 --
    # M1.2-1.4 tidak pernah benar-benar memuat model, cuma preprocessor).
    # Sudah diketahui sejak M1.1 audit sebagai dependency training yang versinya
    # "Tidak ditemukan" di manapun (notebook-audit.md Bagian F, KT-3) -- PROVISIONAL
    # sama seperti pandas/numpy, dikunci ke versi yang terbukti jalan memuat
    # model_final.joblib di environment ini, bukan versi training asli DS.
    # Lihat milestones/1.5-inference-service/decisions.md Keputusan #9.
    "lightgbm==4.7.0",
    "xgboost==3.4.0",
    # sqlalchemy/alembic: mlflow-skinny TIDAK mendeklarasikan ini sebagai
    # dependency, tapi backend registry sqlite:/// (Keputusan #7) butuh
    # keduanya -- tanpanya mlflow.pyfunc.load_model("models:/...") gagal
    # UnsupportedModelRegistryStoreURIException. Baru terungkap saat KK1
    # (instalasi dari venv terpisah, Checkpoint 5) -- venv dev sudah
    # "kebetulan" punya keduanya sebagai sisa instalasi "mlflow" penuh
    # sebelum diganti ke mlflow-skinny (Keputusan #8), jadi gap ini tidak
    # kelihatan sampai diuji dari venv benar-benar bersih.
    # Lihat milestones/1.5-inference-service/decisions.md Keputusan #10.
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    # psycopg2-binary: pindah dari [dev] ke sini Milestone 2.1 -- MLFLOW_TRACKING_URI
    # registry resmi memakai driver postgresql:// (direct-access ke Supabase, lihat
    # milestones/2.1-fondasi-orchestrator-model-registry/decisions.md Keputusan #2),
    # jadi ini sekarang dependency runtime (dipanggil dari flow Prefect), bukan cuma
    # kebutuhan test integrasi seperti sebelumnya.
    "psycopg2-binary==2.9.12",
    # boto3: artifact store MLflow di Supabase Storage (S3-compatible) -- mlflow-skinny
    # tidak bundling boto3, perlu ditambah eksplisit. Lihat Keputusan #3.
    "boto3==1.43.69",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0"]
# prefect: opt-in, bukan dependency inti churn_prediction -- flow orchestration
# (orchestration/flows/) dan consumer lain (real-time API M3.x) tidak semuanya
# butuh Prefect terpasang. Lihat milestones/2.1-fondasi-orchestrator-model-registry/
# decisions.md Keputusan #1.
orchestration = ["prefect==3.8.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `orchestration/` (top-level, bukan di src/) tidak pernah di-pip-install --
# `pytest tests/` (dipanggil langsung, BUKAN `python -m pytest`) tidak
# otomatis menaruh root repo di sys.path, beda dari `python -m pytest` yang
# implisit menambahkannya. Tanpa ini, `from orchestration.flows import
# batch_scoring` (tests/orchestration/test_batch_scoring.py) gagal
# ModuleNotFoundError -- reproducible lokal juga, bukan cuma CI. Ditemukan
# Milestone 2.7 saat verifikasi run CI sungguhan pertama kali berhasil lolos
# instalasi dependency.
pythonpath = ["."]
markers = [
    # Test yang butuh kredensial Supabase/MLflow sungguhan (skip lewat
    # pytest.mark.skipif kalau env var tidak diset, pola established sejak
    # M1.2/M1.3) -- dipisah job CI tersendiri (Milestone 2.7) supaya gerbang
    # unit test (cepat, tanpa secret) tidak menunggu gerbang ini. BEDA dari
    # test yang skip karena file artifact LOKAL tidak ada (artifacs/,
    # gitignored, tidak pernah ada di checkout CI) -- yang terakhir ini
    # SENGAJA tidak ditandai integration karena menambahkan secret tidak
    # akan pernah membuatnya jalan di CI (lihat milestones/2.7-.../decisions.md).
    "integration: butuh kredensial Supabase/MLflow sungguhan (network), bukan cuma kode",
]
