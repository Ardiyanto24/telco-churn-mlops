# Milestone 3.9 -- Deployment metrics_aggregator. HANYA Deployment, TIDAK
# ada Service (pure background worker, tidak expose port -- tidak ada yang
# perlu memanggil/men-scrape pod ini dari luar, beda dari drift-exporter/
# pipeline-health-exporter yang punya Service karena DISCRAPE Prometheus).
# imagePullPolicy IfNotPresent -- Docker Desktop Kubernetes berbagi image
# store dengan `docker build` lokal, pola sama churn-api (M3.3)/
# exporter-exporter M3.5-3.6. Kredensial WAJIB lewat Secret
# `monitoring-secrets` (key MONITORING_METRICS_WRITER_DB_URL, ditambahkan
# manual via `kubectl patch`, TIDAK dicommit).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-aggregator
  namespace: monitoring
  labels:
    app: metrics-aggregator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-aggregator
  template:
    metadata:
      labels:
        app: metrics-aggregator
    spec:
      containers:
        - name: metrics-aggregator
          image: metrics-aggregator:m3.9
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: monitoring-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
